spring:
  application:
    name: "configserver"
  profiles:
    active: git
  cloud:
    bus:
      destination: springCloudBus
      id: "${spring.application.name}:${APP_INSTANCE_ID:${server.port}}"
    stream:
      bindings:
        springCloudBusInput:
          group: "${spring.application.name}-${APP_INSTANCE_ID:${server.port}}"
    config:
      server:
        git:
          uri: "https://github.com/szabolcspeter/EazyBank-config.git"
          default-label: main
          timeout: 5
          clone-on-start: true
          force-pull: true
  rabbitmq:
    host: "localhost"
    port: 5672
    username: "guest"
    password: "guest"

encrypt:
  key: "45D81EC1EF61DF9AD8D3E5BB397F9"

server:
  port: 8071
